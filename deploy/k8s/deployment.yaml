apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-research
  labels: {app: agentic-research}
spec:
  replicas: 1
  selector:
    matchLabels: {app: agentic-research}
  template:
    metadata:
      labels: {app: agentic-research}
    spec:
      containers:
        - name: app
          image: agentic-research:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7860
          env:
            - {name: PORT, value: "7860"}
          envFrom:
            - secretRef: {name: agentic-research-env, optional: true}
          resources:
            requests: {cpu: "500m", memory: 2560Mi}
            limits: {memory: 4Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: 7860}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 7860}
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-research
spec:
  selector: {app: agentic-research}
  ports:
    - port: 80
      targetPort: 7860
